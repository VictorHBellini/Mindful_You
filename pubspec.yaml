name: mindful_you
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  shared_preferences: ^2.2.2
  cupertino_icons: ^1.0.8
  fl_chart: ^0.68.0
  http: ^1.2.1
  pdf: ^3.11.0
  printing: ^5.13.0
  sqflite: ^2.3.3
  sqflite_common_ffi: ^2.3.3
  sqlite3_flutter_libs: ^0.5.24
  path: ^1.9.0
  image_picker: ^1.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.4

  flutter_lints: ^6.0.0

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/img/1024.png"
  adaptive_icon_background: "#F5F5DC" 
  adaptive_icon_foreground: "assets/img/icon_foreground.png"
  min_sdk_android: 21 

flutter:
  uses-material-design: true

  assets:
    - assets/img/
